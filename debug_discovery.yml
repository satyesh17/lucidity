---
- name: "Debug Instance Discovery"
  hosts: localhost
  gather_facts: true
  vars:
    management_account_id: "741752824171"
    dev_account_id: "193779369106"
    external_id: "DiskMonitoring-CrossAccount-12345"
    aws_region: "us-east-1"
    
  tasks:
    - name: "Test management account access"
      community.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        filters:
          instance-state-name: running
      register: mgmt_instances
      
    - name: "Display management account results"
      debug:
        msg: |
          Management Account Instances Found: {{ mgmt_instances.instances | length }}
          {% for instance in mgmt_instances.instances %}
          - {{ instance.instance_id }} ({{ instance.instance_type }}) - {{ instance.state.name }}
          {% endfor %}

    - name: "Assume dev account role"
      community.aws.sts_assume_role:
        role_arn: "arn:aws:iam::{{ dev_account_id }}:role/DiskMonitoringCrossAccountRole"
        role_session_name: "debug-session"
        external_id: "{{ external_id }}"
        duration_seconds: 3600
      register: dev_credentials

    - name: "Test dev account access"
      community.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        filters:
          instance-state-name: running
        aws_access_key: "{{ dev_credentials.sts_creds.access_key }}"
        aws_secret_key: "{{ dev_credentials.sts_creds.secret_key }}"
        aws_session_token: "{{ dev_credentials.sts_creds.session_token }}"
      register: dev_instances
      
    - name: "Display dev account results"
      debug:
        msg: |
          Dev Account Instances Found: {{ dev_instances.instances | length }}
          {% for instance in dev_instances.instances %}
          - {{ instance.instance_id }} ({{ instance.instance_type }}) - {{ instance.state.name }}
          {% endfor %}

    - name: "Check other regions in management account"
      community.aws.ec2_instance_info:
        region: "{{ item }}"
        filters:
          instance-state-name: running
      register: other_regions_mgmt
      loop:
        - us-west-1
        - us-west-2
        - eu-west-1
      ignore_errors: true
      
    - name: "Display other regions results"
      debug:
        msg: |
          Region {{ item.item }}: {{ item.instances | length }} instances
      loop: "{{ other_regions_mgmt.results }}"
      when: item.instances is defined
